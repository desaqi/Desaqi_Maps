<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Avenza Web Clone - GeoPDF Reader</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    
    <!-- Font Awesome untuk Ikon UI -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS kustom -->
    <style>
        body { margin: 0; padding: 0; overscroll-behavior-y: none; }
        #map { height: 100vh; width: 100vw; z-index: 10; }
        .leaflet-control-attribution { display: none !important; }
        
        /* Ubah posisi Layer Control Leaflet ke Kiri Bawah */
        .leaflet-bottom.leaflet-left { bottom: 24px !important; left: 16px !important; z-index: 35 !important; }
        .leaflet-control-layers {
            border-radius: 1rem !important;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1) !important;
            border: 1px solid rgba(226, 232, 240, 0.8) !important;
            padding: 6px 10px !important;
            font-family: inherit !important;
            background: rgba(255, 255, 255, 0.95) !important;
            backdrop-filter: blur(12px);
        }
        .leaflet-control-layers-toggle {
            width: 36px !important;
            height: 36px !important;
        }
        
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-900 font-sans overflow-hidden text-slate-800 select-none">

    <div id="map" class="absolute inset-0 transition-colors duration-500"></div>

    <!-- Crosshair Tengah Layar -->
    <div class="absolute inset-0 z-20 pointer-events-none flex items-center justify-center">
        <div class="relative flex items-center justify-center">
            <div class="absolute w-8 h-[1.5px] bg-slate-900/80 drop-shadow-md rounded-full"></div>
            <div class="absolute w-[1.5px] h-8 bg-slate-900/80 drop-shadow-md rounded-full"></div>
            <div class="absolute w-12 h-12 border-2 border-slate-900/40 rounded-full"></div>
            <div class="absolute w-1.5 h-1.5 bg-red-500 rounded-full shadow-sm border border-white"></div>
        </div>
    </div>

    <!-- Panel Informasi Koordinat Atas -->
    <div class="absolute top-4 left-0 right-0 z-30 flex justify-center pointer-events-none px-4">
        <div class="pointer-events-auto bg-white/95 backdrop-blur-xl shadow-2xl rounded-2xl p-3 w-full max-w-md border border-slate-100/80 flex flex-col items-center">
            <div class="flex items-center justify-between w-full px-1 mb-1">
                <span class="text-[10px] font-bold text-slate-500 tracking-wider uppercase flex items-center gap-1.5">
                    <i class="fas fa-crosshairs text-blue-500"></i> Titik Pusat
                </span>
                <div class="flex items-center gap-2">
                    <span id="geopdf-badge" class="hidden text-[10px] font-bold px-2 py-0.5 bg-emerald-100 text-emerald-700 rounded-full flex items-center gap-1 shadow-sm">
                        <i class="fas fa-check-circle text-[10px]"></i> PDF Aktif
                    </span>
                    <span class="text-[10px] font-bold px-2 py-0.5 bg-slate-100 text-slate-600 rounded-full flex items-center gap-1 shadow-sm">
                        <div id="gps-indicator" class="w-2 h-2 bg-red-500 rounded-full animate-pulse"></div>
                        GPS <span id="gps-accuracy">--m</span>
                    </span>
                </div>
            </div>
            <div class="flex items-center gap-5 font-mono text-sm font-extrabold text-slate-800 mt-1">
                <div class="flex flex-col items-center bg-slate-50 px-3 py-1 rounded-lg border border-slate-100 min-w-[120px]">
                    <span class="text-[9px] text-slate-400 font-sans tracking-wide">LATITUDE</span>
                    <span id="lat-display" class="text-blue-700">-0.000000</span>
                </div>
                <div class="flex flex-col items-center bg-slate-50 px-3 py-1 rounded-lg border border-slate-100 min-w-[120px]">
                    <span class="text-[9px] text-slate-400 font-sans tracking-wide">LONGITUDE</span>
                    <span id="lng-display" class="text-blue-700">0.000000</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Tombol Floating Bawah -->
    <div class="absolute bottom-6 left-0 right-0 z-30 flex justify-center pointer-events-none px-4">
        <div class="pointer-events-auto flex items-end justify-between w-full max-w-md">
            
            <div class="flex-1"></div>

            <div class="flex flex-col gap-3 ml-auto">
                <button id="close-pdf-btn" onclick="closeIsolatedPdf()" class="hidden w-12 h-12 bg-red-500 text-white rounded-2xl shadow-xl flex items-center justify-center text-lg hover:bg-red-600 active:scale-95 transition-all" title="Tutup PDF">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
                <button onclick="addPinAtCenter()" class="w-12 h-12 bg-white text-emerald-600 rounded-2xl shadow-xl flex items-center justify-center text-lg hover:bg-slate-50 active:scale-95 transition-all border border-slate-100" title="Simpan Titik Pin">
                    <i class="fas fa-map-pin"></i>
                </button>
                <button id="gps-btn" onclick="toggleGpsLock()" class="w-12 h-12 bg-white text-slate-600 rounded-2xl shadow-xl flex items-center justify-center text-lg hover:bg-slate-50 active:scale-95 transition-all border border-slate-100" title="Toggle Kunci Lokasi">
                    <i class="fas fa-location-crosshairs"></i>
                </button>
                <button onclick="document.getElementById('file-upload').click()" class="w-14 h-14 bg-indigo-600 text-white rounded-2xl shadow-xl shadow-indigo-600/40 flex items-center justify-center text-xl hover:bg-indigo-700 active:scale-95 transition-all" title="Buka GeoPDF">
                    <i class="fas fa-folder-open"></i>
                </button>
            </div>
        </div>
    </div>

    <input type="file" id="file-upload" accept=".pdf, image/*" class="hidden">

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-24 left-1/2 transform -translate-x-1/2 z-50 hidden transition-all duration-300 w-[90%] max-w-sm pointer-events-none">
        <div id="toast-body" class="bg-slate-800 text-white px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-3 border border-slate-700">
            <i id="toast-icon" class="fas fa-info-circle text-blue-400 text-lg"></i>
            <span id="toast-msg" class="text-xs font-medium leading-relaxed">Notifikasi sistem</span>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="absolute inset-0 bg-slate-950/70 backdrop-blur-md z-50 hidden flex-col items-center justify-center text-white px-6 text-center">
        <div class="loader mb-4"></div>
        <h2 id="loading-title" class="text-base font-bold tracking-wide">Memproses Peta...</h2>
        <p id="loading-desc" class="text-xs text-slate-300 mt-1 max-w-xs">Menyesuaikan Rasio & Mengekstrak Metadata</p>
    </div>

    <!-- External GIS & PDF Libraries -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDco0bw8r3JBaFHka-__rkPtZ2RHQPdbDs&v=weekly"></script>
    <script src="https://unpkg.com/leaflet.gridlayer.googlemutant@0.13.5/dist/Leaflet.GoogleMutant.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // Proyeksi WGS84 & Web Mercator
        proj4.defs("EPSG:4326", "+proj=longlat +datum=WGS84 +no_defs");
        proj4.defs("EPSG:3857", "+proj=merc +a=6378137 +b=6378137 +lat_ts=0.0 +lon_0=0.0 +x_0=0.0 +y_0=0 +k=1.0 +units=m +nadgrids=@null +wktext +no_defs");
        
        // Generate SEMUA Proyeksi UTM Zone (1-60 South & North) untuk presisi global
        for (let z = 1; z <= 60; z++) {
            proj4.defs(`EPSG:${32700 + z}`, `+proj=utm +zone=${z} +south +datum=WGS84 +units=m +no_defs`);
            proj4.defs(`EPSG:${32600 + z}`, `+proj=utm +zone=${z} +datum=WGS84 +units=m +no_defs`);
        }

        const map = L.map('map', { zoomControl: false }).setView([-8.71, 116.13], 12);
        const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 });

        window.gm_authFailure = function() {
            showToast("Google Maps API Gagal. Beralih ke OSM.", "warning");
            map.eachLayer(layer => { if (layer instanceof L.GridLayer.GoogleMutant) map.removeLayer(layer); });
            osmLayer.addTo(map);
        };

        const googleSatellite = L.gridLayer.googleMutant({ type: 'satellite' }).addTo(map);
        const googleRoadmap = L.gridLayer.googleMutant({ type: 'roadmap' });
        
        // Pindahkan posisi kontrol layer ke 'bottomleft'
        L.control.layers({ "Satelit": googleSatellite, "Jalan": googleRoadmap, "OSM": osmLayer }, null, { position: 'bottomleft' }).addTo(map);

        let userMarker = null, userCircle = null, customMapLayer = null;
        window.activePdfTransform = null; 
        window.activePdfEpsg = null;
        window.lastRealGps = null; 
        window.proxyScale = 0.00001; // SKALA PRESISI KHATULISTIWA UNTUK ASPECT RATIO 1:1

        const latDisplay = document.getElementById('lat-display');
        const lngDisplay = document.getElementById('lng-display');

        /**
         * Solver Matriks Affine 2D dengan Metode Least-Squares (N >= 3 titik)
         * Menghasilkan transformasi presisi tinggi tanpa pergeseran (zero accumulation drift).
         */
        function solveLeastSquaresAffine(srcPoints, dstPoints) {
            let n = srcPoints.length;
            if (n < 3) return null;

            let sumX = 0, sumY = 0, sumX2 = 0, sumY2 = 0, sumXY = 0;
            let sumDstX = 0, sumDstX_X = 0, sumDstX_Y = 0;
            let sumDstY = 0, sumDstY_X = 0, sumDstY_Y = 0;

            for (let i = 0; i < n; i++) {
                let sx = srcPoints[i].x;
                let sy = srcPoints[i].y;
                let dx = dstPoints[i].x;
                let dy = dstPoints[i].y;

                sumX += sx; sumY += sy;
                sumX2 += sx * sx; sumY2 += sy * sy; sumXY += sx * sy;

                sumDstX += dx; sumDstX_X += dx * sx; sumDstX_Y += dx * sy;
                sumDstY += dy; sumDstY_X += dy * sx; sumDstY_Y += dy * sy;
            }

            function solve3x3(M, V) {
                let det = M[0][0]*(M[1][1]*M[2][2] - M[1][2]*M[2][1]) -
                          M[0][1]*(M[1][0]*M[2][2] - M[1][2]*M[2][0]) +
                          M[0][2]*(M[1][0]*M[2][1] - M[1][1]*M[2][0]);
                if (Math.abs(det) < 1e-12) return null;

                let det0 = V[0]*(M[1][1]*M[2][2] - M[1][2]*M[2][1]) -
                           M[0][1]*(V[1]*M[2][2] - M[1][2]*V[2]) +
                           M[0][2]*(V[1]*M[2][1] - M[1][1]*V[2]);

                let det1 = M[0][0]*(V[1]*M[2][2] - M[1][2]*V[2]) -
                           V[0]*(M[1][0]*M[2][2] - M[1][2]*M[2][0]) +
                           M[0][2]*(M[1][0]*V[2] - V[1]*M[2][0]);

                let det2 = M[0][0]*(M[1][1]*V[2] - V[1]*M[2][1]) -
                           M[0][1]*(M[1][0]*V[2] - V[1]*M[2][0]) +
                           V[0]*(M[1][0]*M[2][1] - M[1][1]*M[2][0]);

                return [det0 / det, det1 / det, det2 / det];
            }

            let M = [
                [sumX2, sumXY, sumX],
                [sumXY, sumY2, sumY],
                [sumX, sumY, n]
            ];

            let resX = solve3x3(M, [sumDstX_X, sumDstX_Y, sumDstX]);
            let resY = solve3x3(M, [sumDstY_X, sumDstY_Y, sumDstY]);

            if (!resX || !resY) return null;

            return {
                A: resX[0], B: resX[1], C: resX[2], // GeoX = A*px + B*py + C
                D: resY[0], E: resY[1], F: resY[2]  // GeoY = D*px + E*py + F
            };
        }

        map.on('move', () => {
            const center = map.getCenter();
            if (window.activePdfTransform) {
                // Konversi proxy koordinat khatulistiwa ke Piksel Canvas PDF (px, py)
                let px = center.lng / window.proxyScale;
                let py = -center.lat / window.proxyScale;
                
                let t = window.activePdfTransform;
                
                // Hitung Koordinat Terkalibrasi (UTM Meter / Geographic)
                let geoX = t.A * px + t.B * py + t.C;
                let geoY = t.D * px + t.E * py + t.F;
                
                let lat, lng;
                // Konversi UTM/Proyeksi ke WGS84 Lat/Lon jika EPSG tersedia
                if (window.activePdfEpsg && proj4.defs[`EPSG:${window.activePdfEpsg}`]) {
                    let p = proj4(`EPSG:${window.activePdfEpsg}`, 'EPSG:4326', [geoX, geoY]);
                    lat = p[1];
                    lng = p[0];
                } else if (Math.abs(geoY) <= 90 && Math.abs(geoX) <= 180) {
                    lat = geoY;
                    lng = geoX;
                } else if (Math.abs(geoX) <= 90 && Math.abs(geoY) <= 180) {
                    lat = geoX;
                    lng = geoY;
                } else {
                    lat = geoY;
                    lng = geoX;
                }
                
                latDisplay.innerText = lat.toFixed(6);
                lngDisplay.innerText = lng.toFixed(6);
            } else {
                latDisplay.innerText = center.lat.toFixed(6);
                lngDisplay.innerText = center.lng.toFixed(6);
            }
        });
        map.fire('move');

        function showToast(message, type = "info") {
            const toast = document.getElementById('toast'), msg = document.getElementById('toast-msg'), icon = document.getElementById('toast-icon');
            msg.innerText = message;
            icon.className = type === "success" ? "fas fa-check-circle text-emerald-400 text-lg" : (type === "warning" ? "fas fa-exclamation-triangle text-amber-400 text-lg" : "fas fa-info-circle text-blue-400 text-lg");
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 4000);
        }

        let isGpsLocked = true; 
        let geoWatchId = null;
        
        function toggleGpsLock() {
            const btn = document.getElementById('gps-btn');
            isGpsLocked = !isGpsLocked;
            
            if (isGpsLocked) {
                btn.className = "w-12 h-12 bg-blue-600 text-white rounded-2xl shadow-xl shadow-blue-600/30 flex items-center justify-center text-lg hover:bg-blue-700 active:scale-95 transition-all";
                showToast("GPS Terkunci: Layar Mengikuti Lokasi Anda", "success");
                if(window.lastRealGps) updateGpsMarkerVisuals(true);
            } else {
                btn.className = "w-12 h-12 bg-white text-slate-600 rounded-2xl shadow-xl flex items-center justify-center text-lg hover:bg-slate-50 active:scale-95 transition-all border border-slate-100";
                showToast("GPS Dilepas: Anda bebas menggeser Peta", "info");
            }
        }
        
        document.getElementById('gps-btn').className = "w-12 h-12 bg-blue-600 text-white rounded-2xl shadow-xl shadow-blue-600/30 flex items-center justify-center text-lg hover:bg-blue-700 active:scale-95 transition-all";

        function startGpsTracking() {
            if (!navigator.geolocation) {
                showToast("Geolocation tidak didukung di browser ini", "warning");
                return;
            }

            geoWatchId = navigator.geolocation.watchPosition(
                (position) => {
                    window.lastRealGps = L.latLng(position.coords.latitude, position.coords.longitude);
                    updateGpsMarkerVisuals(isGpsLocked);
                    
                    document.getElementById('gps-accuracy').innerText = `±${Math.round(position.coords.accuracy)}m`;
                    document.getElementById('gps-indicator').classList.replace('bg-red-500', 'bg-emerald-500');
                },
                (error) => {
                    console.warn("GPS Error:", error);
                    document.getElementById('gps-indicator').classList.replace('bg-emerald-500', 'bg-red-500');
                },
                { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
            );
        }
        
        startGpsTracking(); // Mulai tracking saat awal

        // Lepas kunci GPS otomatis jika user menggeser layar (seperti Google Maps)
        map.on('dragstart', () => {
            if (isGpsLocked) {
                isGpsLocked = false;
                document.getElementById('gps-btn').className = "w-12 h-12 bg-white text-slate-600 rounded-2xl shadow-xl flex items-center justify-center text-lg hover:bg-slate-50 active:scale-95 transition-all border border-slate-100";
                showToast("Kunci GPS dilepas", "info");
            }
        });

        function updateGpsMarkerVisuals(shouldSetView = false) {
            if (!window.lastRealGps) return;
            let displayLatLng = window.lastRealGps;
            
            // JIKA PDF TERBUKA: Konversi Koordinat Bumi Nyata menjadi Piksel (XY) Peta PDF
            if (window.activePdfTransform) {
                let t = window.activePdfTransform;
                let real = window.lastRealGps;
                
                let geoX, geoY;
                if (window.activePdfEpsg && proj4.defs[`EPSG:${window.activePdfEpsg}`]) {
                    let p = proj4('EPSG:4326', `EPSG:${window.activePdfEpsg}`, [real.lng, real.lat]);
                    geoX = p[0]; geoY = p[1];
                } else {
                    geoX = real.lng; geoY = real.lat;
                }
                
                // Inversi Matriks Affine 2D menggunakan Aturan Cramer
                let det = t.A * t.E - t.B * t.D;
                if (Math.abs(det) > 1e-12) {
                    let px = (t.E * (geoX - t.C) - t.B * (geoY - t.F)) / det;
                    let py = (t.A * (geoY - t.F) - t.D * (geoX - t.C)) / det;
                    
                    displayLatLng = L.latLng(-py * window.proxyScale, px * window.proxyScale);
                }
            }

            if (userMarker) { 
                userMarker.setLatLng(displayLatLng); 
                userCircle.setLatLng(displayLatLng);
            } else {
                userMarker = L.marker(displayLatLng).addTo(map);
                userCircle = L.circle(displayLatLng, { radius: 20, color: '#3b82f6', fillColor: '#3b82f6', fillOpacity: 0.2 }).addTo(map);
            }
            
            if (shouldSetView) {
                map.setView(displayLatLng);
                map.fire('move');
            }
        }

        map.on('locationerror', () => {
            if(isGpsLocked) showToast("Gagal membaca GPS Device", "warning");
        });

        function addPinAtCenter() {
            let lat = parseFloat(latDisplay.innerText);
            let lng = parseFloat(lngDisplay.innerText);
            const center = map.getCenter();
            L.marker(center).addTo(map).bindPopup(`<div class="text-xs font-bold text-center">Pin Disimpan<br>${lat.toFixed(6)}, ${lng.toFixed(6)}</div>`).openPopup();
            showToast("Pin ditambahkan", "success");
        }

        function parseGeoPDFMetadata(arrayBuffer) {
            const pdfText = new TextDecoder('latin1').decode(arrayBuffer);
            let result = { isGeoPDF: false, gpts: [], lpts: [], epsg: null };

            // Deteksi EPSG Code
            let epsgMatch = pdfText.match(/EPSG["',\s]+(\d{4,5})/i);
            if (epsgMatch) {
                result.epsg = parseInt(epsgMatch[1], 10);
            } else {
                let utmMatch = pdfText.match(/UTM zone (\d{1,2})([NnSs]?)/i);
                if (utmMatch) {
                    let zone = parseInt(utmMatch[1], 10);
                    let isSouth = utmMatch[2].toUpperCase() === 'S';
                    result.epsg = (isSouth ? 32700 : 32600) + zone;
                }
            }

            // Fungsi pembersih array PDF yang aman
            function cleanPdfArray(str) {
                let s = str.replace(/[\[\]]/g, ' ').replace(/,/g, ' ');
                // Pisahkan tanda minus yang menempel pada angka (misal 116.1-8.7 menjadi 116.1 -8.7)
                s = s.replace(/(\d)-/g, '$1 -');
                return (s.match(/[+-]?\d+(\.\d+)?([eE][+-]?\d+)?/g) || []).map(Number);
            }

            // Ekstrak SEMUA /GPTS dan /LPTS (Hindari salah pilih peta inset kecil)
            let gptsMatches = [...pdfText.matchAll(/\/GPTS\s*\[(.*?)\]/gs)];
            let lptsMatches = [...pdfText.matchAll(/\/LPTS\s*\[(.*?)\]/gs)];

            let bestGpts = [], bestLpts = [];
            let maxPoints = 0;

            for (let i = 0; i < Math.min(gptsMatches.length, lptsMatches.length); i++) {
                let gArr = cleanPdfArray(gptsMatches[i][1]);
                let lArr = cleanPdfArray(lptsMatches[i][1]);
                
                // Pilih array dengan titik terbanyak (peta utama biasanya memiliki titik paling banyak)
                if (gArr.length >= 6 && lArr.length >= 6 && gArr.length > maxPoints) {
                    bestGpts = gArr;
                    bestLpts = lArr;
                    maxPoints = gArr.length;
                }
            }

            if (bestGpts.length >= 6) {
                result.gpts = bestGpts;
                result.lpts = bestLpts;
                result.isGeoPDF = true;
            }

            return result;
        }

        function extractTransform(meta, viewport) {
            let { gpts, lpts, epsg } = meta;
            if (!gpts || gpts.length < 6 || !lpts || lpts.length < 6) return null;

            let numPoints = Math.min(Math.floor(gpts.length / 2), Math.floor(lpts.length / 2));
            let srcPoints = []; // Canvas Pixel (px, py)
            let dstPoints = []; // Geo Coordinates (Easting/Northing or Lon/Lat)

            // Beri toleransi minor untuk titik kontrol yang melebihi batas (bleed area)
            let isNormalized = lpts.every(v => v >= -0.1 && v <= 1.1);

            // Deteksi Susunan GPTS dengan pendekatan statistik cerdas
            let sum1 = 0, sum2 = 0;
            for(let i=0; i < numPoints * 2; i+=2) {
                sum1 += Math.abs(gpts[i]);
                sum2 += Math.abs(gpts[i+1]);
            }
            let avg1 = sum1 / numPoints;
            let avg2 = sum2 / numPoints;

            let isLatFirst = false; // Standar umum OGC adalah [Easting, Northing] / [X, Y] atau [Lon, Lat]
            if (avg1 <= 90 && avg2 > 90 && avg2 <= 180) {
                isLatFirst = true; // Jelas format [Lat, Lon]
            } else if (avg1 > 800000 || (avg1 > 0 && avg2 > 0 && avg1 > avg2 && avg1 > 500000)) {
                isLatFirst = true; // Menangkap kasus UTM Northing ada di depan (sangat besar)
            } else if (avg2 > 800000) {
                isLatFirst = false; // Standar UTM Easting, Northing
            }

            for (let i = 0; i < numPoints; i++) {
                let val1 = gpts[i * 2];
                let val2 = gpts[i * 2 + 1];
                let u = lpts[i * 2], v = lpts[i * 2 + 1];

                let px, py;
                if (isNormalized) {
                    // KUNCI PRESISI 2: Menghitung PDF Point dari ViewBox, lalu mengkonversi ke Viewport Canvas
                    let pdfX = viewport.viewBox[0] + (u * viewport.viewBox[2]);
                    let pdfY = viewport.viewBox[1] + (v * viewport.viewBox[3]);
                    let pt = viewport.convertToViewportPoint(pdfX, pdfY);
                    px = pt[0]; py = pt[1];
                } else {
                    let pt = viewport.convertToViewportPoint(u, v);
                    px = pt[0]; py = pt[1];
                }

                let geoX, geoY;
                if (isLatFirst) {
                    geoY = val1; // Lat / Northing
                    geoX = val2; // Lon / Easting
                } else {
                    geoX = val1; // Lon / Easting
                    geoY = val2; // Lat / Northing
                }

                srcPoints.push({ x: px, y: py });
                dstPoints.push({ x: geoX, y: geoY });
            }

            // Hitung Transformasi Affine Least-Squares Presisi Tinggi
            return solveLeastSquaresAffine(srcPoints, dstPoints);
        }

        document.getElementById('file-upload').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('loading-overlay').style.display = 'flex';

            try {
                let imageUrl = '';
                let geoMetadata = null;
                let viewport = null;

                if (file.type === 'application/pdf') {
                    const arrayBuffer = await file.arrayBuffer();
                    geoMetadata = parseGeoPDFMetadata(arrayBuffer);

                    const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(arrayBuffer) }).promise;
                    const page = await pdf.getPage(1);
                    viewport = page.getViewport({ scale: 2.0 }); 

                    const canvas = document.createElement('canvas');
                    canvas.height = viewport.height; canvas.width = viewport.width;
                    await page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise;
                    imageUrl = canvas.toDataURL('image/png');
                } else if (file.type.startsWith('image/')) {
                    imageUrl = URL.createObjectURL(file);
                    viewport = { width: 1000, height: 1000 };
                }

                overlayIsolatedPDF(imageUrl, geoMetadata, viewport);
            } catch (error) {
                console.error(error);
                showToast("Gagal memproses file. Pastikan itu GeoPDF valid.", "warning");
            } finally {
                document.getElementById('loading-overlay').style.display = 'none';
                e.target.value = '';
            }
        });

        function overlayIsolatedPDF(imageUrl, geoMetadata, viewport) {
            if (customMapLayer) map.removeLayer(customMapLayer);

            // Bersihkan Base Map
            map.eachLayer(layer => { 
                if (layer instanceof L.GridLayer.GoogleMutant || layer === osmLayer) map.removeLayer(layer);
            });
            document.getElementById('map').style.backgroundColor = '#0f172a'; // Background gelap

            window.activePdfTransform = null;
            window.activePdfEpsg = null;
            
            // TEKNIK RAHASIA: Proyeksikan Kanvas di Khatulistiwa (Lat 0)
            // Mengisolasi peta kertas 100% bebas dari distorsi kelengkungan Web Mercator.
            let imageBounds = [
                [0, 0], 
                [-viewport.height * window.proxyScale, viewport.width * window.proxyScale]
            ];

            if (geoMetadata && geoMetadata.isGeoPDF) {
                let transform = extractTransform(geoMetadata, viewport);
                
                // Fallback Cerdas: Jika EPSG gagal diekstrak tapi terdeteksi koordinat UTM (angka besar)
                if (!geoMetadata.epsg && transform && (Math.abs(transform.F) > 100000 || Math.abs(transform.C) > 100000)) {
                    if (window.lastRealGps) {
                        let zone = Math.floor((window.lastRealGps.lng + 180) / 6) + 1;
                        let isSouth = window.lastRealGps.lat < 0;
                        geoMetadata.epsg = (isSouth ? 32700 : 32600) + zone;
                        showToast(`Sistem Otomatis: UTM Zone ${zone}${isSouth ? 'S' : 'N'} diterapkan`, "info");
                    }
                }

                if (transform) {
                    window.activePdfTransform = transform;
                    window.activePdfEpsg = geoMetadata.epsg;
                    document.getElementById('geopdf-badge').classList.remove('hidden');
                    document.getElementById('geopdf-badge').classList.add('flex');
                    showToast("Peta Terkalibrasi Sempurna (Presisi Avenza)!", "success");
                } else {
                    showToast("Gagal menghitung matriks kalibrasi.", "warning");
                }
            } else {
                showToast("PDF dimuat sebagai Gambar Biasa", "info");
            }

            customMapLayer = L.imageOverlay(imageUrl, imageBounds, {
                opacity: 1.0, 
                interactive: true
            }).addTo(map);

            // Tampilkan UI Tutup PDF
            document.getElementById('close-pdf-btn').classList.remove('hidden');
            document.getElementById('close-pdf-btn').classList.add('flex');
            
            // Arahkan Kamera dan Tempatkan GPS di Koordinat Peta Baru
            map.fitBounds(imageBounds);
            updateGpsMarkerVisuals(true);
        }

        function closeIsolatedPdf() {
            if (customMapLayer) { map.removeLayer(customMapLayer); customMapLayer = null; }
            window.activePdfTransform = null;
            window.activePdfEpsg = null;
            
            document.getElementById('map').style.backgroundColor = '';
            document.getElementById('geopdf-badge').classList.add('hidden');
            document.getElementById('geopdf-badge').classList.remove('flex');
            document.getElementById('close-pdf-btn').classList.add('hidden');
            document.getElementById('close-pdf-btn').classList.remove('flex');
            
            // Nyalakan ulang Google Maps
            googleSatellite.addTo(map);
            
            // Kembalikan Posisi Anda di dunia nyata
            updateGpsMarkerVisuals(true);
            map.setZoom(16);
            showToast("Kembali ke Live Maps", "info");
        }
    </script>
